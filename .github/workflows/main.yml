name: Deploy game to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout game branch
        uses: actions/checkout@v4
        with:
          repository: svyre/na_sebe
          ref: download-na-sebe-game

      - name: Check game files
        run: test -f play/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: play

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
